<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velora | Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="page-shell">
    <div class="brand-panel">
      <div class="brand-badge">V</div>
      <h1>Velora</h1>
      <p>Elevated essentials for your everyday style.</p>
      <ul class="feature-list">
        <li>Fast checkout and secure payments</li>
        <li>Exclusive launches and member perks</li>
        <li>Personalized recommendations</li>
      </ul>
    </div>

    <div class="signup-card">
      <h2>Create your account</h2>
      <p class="subtitle">Join Velora and shop the latest arrivals.</p>

      <form id="signupForm" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="fullName">Full name</label>
            <input type="text" class="form-control" id="fullName" placeholder="Ava Johnson" required />
          </div>
          <div class="col-12">
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="ava@email.com" required />
          </div>
          <div class="col-12">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" required />
          </div>
          <div class="col-12">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input type="password" class="form-control" id="confirmPassword" required />
          </div>
        </div>

        <div class="form-check mt-3">
          <input class="form-check-input" type="checkbox" id="terms" required />
          <label class="form-check-label" for="terms">
            I agree to the Terms of Service and Privacy Policy.
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4">Create account</button>
        <div id="formMessage" class="mt-3"></div>
      </form>

      <p class="login-link mt-4">Already have an account? <a href="../Login/Login.html">Log in</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
